name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ruff-format:
    name: ruff-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Check code formatting
        run: uv run ruff format --check api mcp-server tests scripts

  ruff-check:
    name: ruff-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Lint Python codebase
        run: uv run ruff check api mcp-server tests scripts

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web SPA bundle for integrated tests
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Verify dependency lockfile
        run: uv sync --frozen

      - name: Run test suite (SQLite in-memory)
        run: uv run pytest -v --tb=short

  integration:
    name: integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/erid
      EVENT_BUS_BACKEND: postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Same suite as the pytest job, but against real Postgres: the schema is
      # built by the Alembic migrations, so enum/FTS/upsert drift is caught here.
      - name: Run test suite (Postgres)
        env:
          ERID_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/erid
          # The suite drives the bus per-test; the Postgres bus has its own tests.
          EVENT_BUS_BACKEND: memory
        run: uv run pytest -v --tb=short

      - name: Start API against live services
        working-directory: api
        run: |
          set -euo pipefail
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          UVICORN_PID=$!
          echo "Started uvicorn (PID $UVICORN_PID); waiting for /health..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "API is healthy and responding on port 8000 (attempt $i)."
              exit 0
            fi
            if ! kill -0 $UVICORN_PID 2>/dev/null; then
              echo "Uvicorn process crashed unexpectedly. Startup log:" >&2
              cat /tmp/uvicorn.log >&2
              exit 1
            fi
            sleep 1
          done
          echo "Timed out waiting for API /health after 30 seconds. Startup log:" >&2
          cat /tmp/uvicorn.log >&2
          exit 1

      - name: Smoke-test live API (Workspaces, Tasks, Decisions, Handoffs, Search)
        run: |
          set -euo pipefail

          echo "1. Probing health endpoint..."
          curl -sf http://127.0.0.1:8000/health

          echo "2. Provisioning workspace 'ci'..."
          KEY=$(curl -sf -XPOST 'http://127.0.0.1:8000/api/workspaces?slug=ci' \
            | uv run python -c 'import sys,json; print(json.load(sys.stdin)["api_key"])')

          echo "3. Creating task..."
          TASK_RESP=$(curl -sf -XPOST http://127.0.0.1:8000/api/workspaces/ci/tasks \
            -H "X-API-Key: $KEY" -H 'Content-Type: application/json' -d '{"title":"ci smoke task"}')
          TASK_ID=$(echo "$TASK_RESP" | uv run python -c 'import sys,json; print(json.load(sys.stdin)["id"])')

          echo "4. Creating decision..."
          curl -sf -XPOST http://127.0.0.1:8000/api/workspaces/ci/decisions \
            -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
            -d '{"title":"ci smoke decision","reason":"verify pipeline","task_id":"'"$TASK_ID"'"}'

          echo "5. Creating and testing session handoff..."
          HANDOFF_RESP=$(curl -sf -XPOST http://127.0.0.1:8000/api/workspaces/ci/handoffs \
            -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
            -d '{"summary":"ci smoke handoff","task_id":"'"$TASK_ID"'","next_action":"verify pipeline"}')
          HANDOFF_ID=$(echo "$HANDOFF_RESP" | uv run python -c 'import sys,json; print(json.load(sys.stdin)["id"])')

          curl -sf -XPOST "http://127.0.0.1:8000/api/workspaces/ci/handoffs/$HANDOFF_ID/acknowledge" \
            -H "X-API-Key: $KEY"

          echo "6. Searching context..."
          curl -sf "http://127.0.0.1:8000/api/workspaces/ci/search?q=smoke" \
            -H "X-API-Key: $KEY"

          echo "7. Broadcasting and testing presence..."
          curl -sf -XPOST http://127.0.0.1:8000/api/workspaces/ci/presence \
            -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
            -d '{"actor_name":"ci-bot","actor_type":"human","current_task":"pipeline smoke"}'
          curl -sf http://127.0.0.1:8000/api/workspaces/ci/presence \
            -H "X-API-Key: $KEY" \
            | uv run python -c 'import sys,json; p=json.load(sys.stdin); assert any(x["actor_name"]=="ci-bot" for x in p)'

          echo "8. Verifying workspace summary..."
          curl -sf http://127.0.0.1:8000/api/workspaces/ci/summary \
            -H "X-API-Key: $KEY" \
            | uv run python -c 'import sys,json; d=json.load(sys.stdin); assert d["task_count"] >= 1; assert d["open_handoff_count"] == 0'

      - name: Run MCP tool round-trip against live API
        working-directory: mcp-server
        env:
          ERID_LIVE_API: http://127.0.0.1:8000
        run: uv run pytest tests/test_tools.py -v

      - name: Load smoke (concurrent agents + realtime delivery)
        run: |
          set -euo pipefail
          uv run python scripts/loadtest.py --urls http://127.0.0.1:8000 \
            --workspaces 3 --agents-per-workspace 4 --duration 15 --json | tee /tmp/load.json
          uv run python - <<'PY'
          import json
          d = json.load(open("/tmp/load.json"))
          print(json.dumps(d, indent=2))
          assert d["success_rate"] == 1.0, f"requests failed under load: {d['status_codes']}"
          assert d["realtime"]["delivery_rate"] == 1.0, f"realtime events lost: {d['realtime']}"
          PY

      - name: Dump API logs on failure
        if: failure()
        run: |
          if [ -f /tmp/uvicorn.log ]; then
            echo "=== Uvicorn Logs ==="
            cat /tmp/uvicorn.log
          fi

  web:
    name: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit & component tests
        run: npm test

      - name: Build web SPA
        run: npm run build

      - name: Verify production build bundle
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "Verified dist/index.html and dist/assets"

  vscode:
    name: vscode-extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck extension
        run: npm run typecheck

      - name: Compile extension
        run: npm run compile

      - name: Package extension (vsce)
        run: npm run package

  jetbrains:
    name: jetbrains-plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/jetbrains
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Java
        run: ./gradlew compileJava

      - name: Build plugin package
        run: ./gradlew buildPlugin

  compose-verify:
    name: compose-verify (full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build compose images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d postgres api web

      - name: Wait for API to become healthy
        run: |
          set -e
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health && exit 0 || sleep 2
          done
          echo "API did not become healthy" >&2
          docker compose logs --tail 100 api
          exit 1

      - name: Wait for Web frontend
        run: |
          set -e
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080 > /dev/null && exit 0 || sleep 1
          done
          echo "Web frontend did not become healthy" >&2
          docker compose logs --tail 100 web
          exit 1

      - name: Full stack E2E integration smoke (SPA + Reverse Proxy REST + WS)
        run: |
          set -euo pipefail
          SLUG="e2e-compose-$GITHUB_RUN_ID"

          echo "1. Verifying Web frontend serves Nordic Editorial SPA..."
          curl -sf http://localhost:8080/ | grep -i "erid"
          curl -sf http://localhost:8080/continuous-context | grep -i "erid"

          echo "2. Provisioning workspace via Web reverse proxy..."
          KEY=$(curl -sf -XPOST "http://localhost:8080/api/workspaces?slug=$SLUG" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['api_key'])")

          echo "3. Checking workspace listed via Web reverse proxy..."
          curl -sf http://localhost:8080/api/workspaces \
            | python3 -c "import sys,json; slugs=[w['slug'] for w in json.load(sys.stdin)]; assert '$SLUG' in slugs, f'workspace not listed: {slugs}'"

          echo "4. Creating task via Web reverse proxy..."
          TASK_ID=$(curl -sf -XPOST "http://localhost:8080/api/workspaces/$SLUG/tasks" \
            -H "X-API-Key: $KEY" -H 'Content-Type: application/json' -d '{"title":"compose e2e task"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          echo "5. Creating decision via Web reverse proxy..."
          curl -sf -XPOST "http://localhost:8080/api/workspaces/$SLUG/decisions" \
            -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
            -d '{"title":"compose e2e decision","reason":"verify frontend-backend proxy","task_id":"'"$TASK_ID"'"}'

          echo "6. Creating session handoff via Web reverse proxy..."
          curl -sf -XPOST "http://localhost:8080/api/workspaces/$SLUG/handoffs" \
            -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
            -d '{"summary":"compose e2e handoff","task_id":"'"$TASK_ID"'","next_action":"verify"}'

          echo "7. Broadcasting presence via Web reverse proxy..."
          curl -sf -XPOST "http://localhost:8080/api/workspaces/$SLUG/presence" \
            -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
            -d '{"actor_name":"compose-e2e-agent","actor_type":"human","current_task":"full stack verification"}'

          echo "8. Searching context via Web reverse proxy..."
          curl -sf "http://localhost:8080/api/workspaces/$SLUG/search?q=compose" \
            -H "X-API-Key: $KEY" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d['tasks']) >= 1 or len(d['decisions']) >= 1"

          echo "9. Verifying workspace summary via Web reverse proxy..."
          curl -sf "http://localhost:8080/api/workspaces/$SLUG/summary" \
            -H "X-API-Key: $KEY" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['task_count'] >= 1; assert d['open_handoff_count'] >= 1"

          echo "10. Probing WebSocket upgrade on Web reverse proxy..."
          python3 -c "
          import http.client
          conn = http.client.HTTPConnection('localhost', 8080)
          conn.request('GET', '/api/workspaces/$SLUG/ws?api_key=$KEY', headers={
              'Upgrade': 'websocket',
              'Connection': 'Upgrade',
              'Sec-WebSocket-Key': 'dGhlIHNhbXBsZSBub25jZQ==',
              'Sec-WebSocket-Version': '13',
          })
          resp = conn.getresponse()
          print('WebSocket upgrade response:', resp.status, resp.reason)
          assert resp.status == 101, f'Expected 101 Switching Protocols, got {resp.status}'
          conn.close()
          "

      - name: Dump Compose logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  security-audit:
    name: security-audit (dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Audit Python dependencies (locked versions)
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --strict --disable-pip -r /tmp/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit dashboard runtime dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  k8s-manifests:
    name: k8s-manifests (kubeconform)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Render and validate the base
        run: |
          kubectl kustomize deploy/k8s/base > /tmp/rendered.yaml
          kubeconform -strict -summary -kubernetes-version 1.30.0 /tmp/rendered.yaml

      - name: Validate optional manifests
        run: |
          kubeconform -strict -summary -kubernetes-version 1.30.0 -ignore-missing-schemas \
            deploy/k8s/optional/*.yaml

  compose-prod-verify:
    name: compose-prod-verify (replicas behind Caddy, production mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ERID_ENV: prod
      ERID_DOMAIN: localhost
      ERID_API_REPLICAS: "3"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate production secrets
        run: |
          openssl genpkey -algorithm ed25519 -out /tmp/jwt.pem
          openssl pkey -in /tmp/jwt.pem -pubout -out /tmp/jwt.pub
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "ERID_ADMIN_TOKEN=$(openssl rand -hex 32)"
            echo "ERID_SESSION_SECRET=$(openssl rand -hex 32)"
            echo "ERID_JWT_PRIVATE_KEY<<EOF"; cat /tmp/jwt.pem; echo "EOF"
            echo "ERID_JWT_PUBLIC_KEY<<EOF"; cat /tmp/jwt.pub; echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Start the production stack
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build postgres api web caddy

      - name: Wait for every API replica to be ready
        run: |
          set -e
          for i in $(seq 1 90); do
            ready=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps api --format '{{.Health}}' | grep -c healthy || true)
            [ "$ready" = "3" ] && break
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          [ "$ready" = "3" ] || { echo "expected 3 healthy API replicas, got $ready"; exit 1; }
          for i in $(seq 1 30); do curl -skf https://localhost/health && break; sleep 2; done

      - name: Verify the stack through Caddy
        run: |
          set -euo pipefail
          # Security headers and TLS.
          curl -skI https://localhost/api/workspaces/x/tasks | tee /tmp/h.txt
          grep -qi '^strict-transport-security' /tmp/h.txt
          grep -qi "^content-security-policy: default-src 'none'" /tmp/h.txt
          # Production mode: anonymous provisioning is refused, the operator's works.
          test "$(curl -sk -o /dev/null -w '%{http_code}' -XPOST 'https://localhost/api/workspaces?slug=ci')" = 401
          KEY=$(curl -skf -XPOST 'https://localhost/api/workspaces?slug=ci' -H "X-Admin-Token: $ERID_ADMIN_TOKEN" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["api_key"])')
          # Writes and reads spread over the replicas by Caddy.
          for i in $(seq 1 30); do
            curl -skf -XPOST https://localhost/api/workspaces/ci/tasks -H "X-API-Key: $KEY" \
              -H 'content-type: application/json' -d "{\"title\": \"t$i\"}" > /dev/null
          done
          COUNT=$(curl -skf "https://localhost/api/workspaces/ci/tasks" -H "X-API-Key: $KEY" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))')
          test "$COUNT" = 30
          # Interactive docs are off in production.
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/docs)" != 200 || \
            ! curl -sk https://localhost/docs | grep -qi swagger

      - name: Realtime events cross replicas behind Caddy
        run: |
          set -euo pipefail
          pip install --quiet "websockets>=13" httpx
          KEY=$(curl -skf -XPOST 'https://localhost/api/workspaces?slug=ci-ws' -H "X-Admin-Token: $ERID_ADMIN_TOKEN" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["api_key"])')
          KEY=$KEY python3 - <<'PY'
          import asyncio, json, os, ssl
          import httpx, websockets
          key = os.environ["KEY"]
          ctx = ssl.create_default_context(); ctx.check_hostname = False; ctx.verify_mode = ssl.CERT_NONE
          async def main():
              url = f"wss://localhost/api/workspaces/ci-ws/ws?api_key={key}"
              async with websockets.connect(url, ssl=ctx) as ws:
                  async with httpx.AsyncClient(verify=False) as http:
                      for i in range(12):  # least_conn spreads these over all replicas
                          r = await http.post("https://localhost/api/workspaces/ci-ws/tasks",
                                              json={"title": f"rt{i}"}, headers={"X-API-Key": key})
                          r.raise_for_status()
                  seen = set()
                  while len(seen) < 12:
                      msg = json.loads(await asyncio.wait_for(ws.recv(), timeout=10))
                      if msg.get("type") == "task_created":
                          seen.add(msg["data"]["title"])
              print("received all", len(seen), "events")
          asyncio.run(main())
          PY

      - name: Scale the API down and up
        run: |
          set -e
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-recreate --scale api=1 api
          for i in $(seq 1 20); do curl -skf https://localhost/health > /dev/null && break; sleep 1; done
          curl -skf https://localhost/health
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-recreate --scale api=4 api
          for i in $(seq 1 60); do
            ready=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps api --format '{{.Health}}' | grep -c healthy || true)
            [ "$ready" = "4" ] && break; sleep 2
          done
          [ "$ready" = "4" ]
          for i in $(seq 1 20); do curl -skf https://localhost/health > /dev/null; done

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - ruff-format
      - ruff-check
      - pytest
      - integration
      - web
      - vscode
      - jetbrains
      - compose-verify
      - security-audit
      - k8s-manifests
      - compose-prod-verify
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "CI job results: $results"
          if [[ "$results" =~ (failure|cancelled) ]]; then
            echo "::error::One or more upstream CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI pipeline checks passed successfully!"
