name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-format:
    name: ruff-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff format --check api mcp-server tests

  ruff-check:
    name: ruff-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff check api mcp-server tests

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - name: Run tests (SQLite in-memory; no services required)
        run: uv run pytest -v --tb=short

  integration:
    name: integration (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/erid
      REDIS_URL: redis://localhost:6379/0
      EVENT_BUS_BACKEND: redis
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.14
      - name: Start the API against real services
        working-directory: api
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break || sleep 1
          done
      - name: Smoke-test the live API (Redis-backed event bus)
        run: |
          set -e
          curl -sf http://127.0.0.1:8000/health
          KEY=$(curl -sf -XPOST 'http://127.0.0.1:8000/api/workspaces?slug=ci' | uv run python -c 'import sys,json;print(json.load(sys.stdin)["api_key"])')
          curl -sf -XPOST http://127.0.0.1:8000/api/workspaces/ci/tasks \
            -H "X-API-Key: $KEY" -H 'Content-Type: application/json' -d '{"title":"ci smoke"}'
          curl -sf http://127.0.0.1:8000/api/workspaces/ci/summary
      - name: Run MCP tool round-trip against the live API
        working-directory: mcp-server
        env:
          ERID_LIVE_API: http://127.0.0.1:8000
        run: uv run pytest tests/test_tools.py -v

  web:
    name: web-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
