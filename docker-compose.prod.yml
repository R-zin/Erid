# Production overlay for a public (soft-launch) deployment.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# (infra/deploy.sh does this when ERID_ENV=prod.) What it changes over the dev stack:
#   * Caddy in front on :80/:443 with automatic HTTPS for $ERID_DOMAIN. It routes
#     /api, /mcp, /health, /docs to the API and everything else to the dashboard.
#   * api and web are no longer published on host ports; only Caddy is.
#   * Closed mode by default (no anonymous workspaces) and secrets are REQUIRED:
#     compose refuses to start if POSTGRES_PASSWORD, ERID_ADMIN_TOKEN,
#     ERID_DOMAIN or the JWT keypair are missing, and the API itself
#     (ERID_ENV=production) refuses any other unsafe setting.
#   * Postgres data lives in a named volume so `docker compose down` keeps it.
#     Note: POSTGRES_PASSWORD only takes effect when the volume is first created.
#   * The API runs as ERID_API_REPLICAS replicas (default 2); Caddy balances
#     across them and retries another replica if one is down or restarting.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    ports: !reset []
    # Horizontal scale: N identical replicas behind Caddy, sharing Postgres for
    # state and LISTEN/NOTIFY for realtime fan-out. Change with
    # ERID_API_REPLICAS or `docker compose ... up -d --scale api=N`. (Compose
    # does not autoscale; for that, use the Kubernetes HPA in deploy/k8s/.)
    deploy:
      replicas: ${ERID_API_REPLICAS:-2}
    environment:
      ERID_ENV: production
      EVENT_BUS_BACKEND: postgres
      # Only Caddy reaches the API on the compose network, so its
      # X-Forwarded-For is trusted for the client address.
      FORWARDED_ALLOW_IPS: "*"
      # Per-replica connection budget: replicas x (5 + 5) + 1 LISTEN each.
      ERID_DB_POOL_SIZE: ${ERID_DB_POOL_SIZE:-5}
      ERID_DB_MAX_OVERFLOW: ${ERID_DB_MAX_OVERFLOW:-5}
      ERID_METRICS_TOKEN: ${ERID_METRICS_TOKEN:-}
      # Production mode refuses to start without a stable signing keypair:
      # replicas must verify each other's tokens. See .env.example.
      ERID_JWT_PRIVATE_KEY: ${ERID_JWT_PRIVATE_KEY:?set ERID_JWT_PRIVATE_KEY in .env}
      ERID_JWT_PUBLIC_KEY: ${ERID_JWT_PUBLIC_KEY:?set ERID_JWT_PUBLIC_KEY in .env}
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/erid
      CORS_ORIGINS: https://${ERID_DOMAIN:?set ERID_DOMAIN in .env}
      ERID_ALLOW_OPEN_WORKSPACES: ${ERID_ALLOW_OPEN_WORKSPACES:-0}
      ERID_ADMIN_TOKEN: ${ERID_ADMIN_TOKEN:?set ERID_ADMIN_TOKEN in .env}
      ERID_PUBLIC_WORKSPACE_DIRECTORY: ${ERID_PUBLIC_WORKSPACE_DIRECTORY:-0}
      ERID_OAUTH_REDIRECT_BASE: https://${ERID_DOMAIN}
      ERID_OAUTH_WEB_BASE: https://${ERID_DOMAIN}
    restart: unless-stopped

  web:
    ports: !reset []
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ERID_DOMAIN: ${ERID_DOMAIN:?set ERID_DOMAIN in .env}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
