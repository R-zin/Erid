# Cursor reads MCP servers from .cursor/mcp.json (project) or ~/.cursor/mcp.json
# (global) under the top-level key `mcpServers`. Equivalent JSON:
#
#   { "mcpServers": { "erid": { "url": "http://localhost:8000/mcp",
#       "headers": { "X-Erid-Workspace": "your-workspace", "X-API-Key": "<key>" } } } }
mcp:
  erid:
    url: http://localhost:8000/mcp
    headers:
      X-Erid-Workspace: your-workspace
      X-API-Key: ""   # omit for an open workspace
