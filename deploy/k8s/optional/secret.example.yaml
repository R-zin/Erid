# Template only; never commit real values. Prefer creating it from a file:
#   kubectl -n erid create secret generic erid-secrets --from-env-file=erid-secrets.env
# or manage it with External Secrets / Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: erid-secrets
  namespace: erid
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://erid:CHANGE_ME@postgres.example.internal:5432/erid
  # Only when DATABASE_URL points at PgBouncer (and set ERID_DB_PGBOUNCER=1):
  # ERID_DIRECT_DATABASE_URL: postgresql+asyncpg://erid:CHANGE_ME@postgres-direct.example.internal:5432/erid
  ERID_ADMIN_TOKEN: CHANGE_ME              # openssl rand -hex 32
  ERID_SESSION_SECRET: CHANGE_ME           # openssl rand -hex 32
  ERID_METRICS_TOKEN: CHANGE_ME            # openssl rand -hex 32
  ERID_JWT_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    CHANGE_ME
    -----END PRIVATE KEY-----
  ERID_JWT_PUBLIC_KEY: |
    -----BEGIN PUBLIC KEY-----
    CHANGE_ME
    -----END PUBLIC KEY-----
  CORS_ORIGINS: https://erid.example.com
  ERID_OAUTH_REDIRECT_BASE: https://erid.example.com
  ERID_OAUTH_WEB_BASE: https://erid.example.com
