# Static dashboard + reverse proxy to the `api` service (web container).
# The React app uses same-origin relative URLs (`/api/...`, `ws://.../api/.../ws`),
# so REST and the WebSocket event stream are both proxied to `api` here.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Built SPA assets; fall back to index.html for client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Both REST and WebSocket. $connection_upgrade (from nginx.websocket.conf)
    # is "upgrade" only when the client sends an Upgrade header, so plain REST
    # calls are unaffected while /ws upgrades correctly.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The WebSocket stream stays open for the connection's life.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
