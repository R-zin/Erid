name: 🔍 Large Repo Analysis (Chunked)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NIM_MODEL: ${{ vars.NIM_MODEL || 'z-ai/glm-5.2' }}

jobs:
  analyze:
    name: Analyze Large Repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full history so the run can diff against the previous commit / PR base.
          fetch-depth: 0

      - name: Setup uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Verify Secret Exists
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "❌ NVIDIA_API_KEY is EMPTY or NOT SET"
            exit 1
          fi
          echo "✅ NVIDIA_API_KEY is set (length: ${#NVIDIA_API_KEY})"

      - name: Install Dependencies
        run: uv sync --frozen --no-dev

      - name: Run Chunked Repo Analysis
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Git context so the report can show what this commit / PR changed.
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_BEFORE: ${{ github.event.before }}
        run: uv run --no-sync python .github/scripts/analyze_repo_large.py "${{ github.workspace }}"

      - name: Upload Analysis Report
        uses: actions/upload-artifact@v4
        with:
          name: repo-analysis-report
          path: repo_analysis.md
          retention-days: 30

  comment:
    name: Post Analysis as PR Comment
    needs: analyze
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Download Analysis Report
        uses: actions/download-artifact@v4
        with:
          name: repo-analysis-report

      - name: Upsert PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const analysis = fs.readFileSync('repo_analysis.md', 'utf8');
            const maxLength = 65000;
            const truncated = analysis.length > maxLength
              ? analysis.substring(0, maxLength) + "\n\n⚠️ *Report truncated. Download the full artifact from the workflow run.*"
              : analysis;
            const marker = `<!-- repo-analysis:${process.env.NIM_MODEL} -->`;
            const body = `${marker}\n## 🤖 ${process.env.NIM_MODEL} Repo Analysis\n\n${truncated}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              core.info(`Updated existing comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info('Created new analysis comment');
            }
