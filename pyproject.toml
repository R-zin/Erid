[project]
name = "erid"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.140.0",
    "sqlalchemy>=2.0.51",
    "fastmcp>=2.0.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "asyncpg>=0.30.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "redis>=8.0.1",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.4",
    "alembic>=1.18.5",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "openai>=2.49.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # FastAPI uses Depends()/Security() in argument defaults by design.
    "UP042",  # `str, enum.Enum` is the SQLAlchemy-friendly idiom (not StrEnum).
]
